name: Deploy public demo to GitHub Pages

# ⚠️ 本仓库改动（fork 适配）：把触发条件从 `push: branches: [main]` 改为**仅手动**。
#
# 原因：本仓库未启用 GitHub Pages，也没有为它配置 `pages` 权限与环境。
# 保持 push 触发会让**每次推 main 都红一个 job**，把「这次构建到底成没成」
# 的判断搅浑 —— 它不产出任何构建产物，只部署只读演示站，与本仓库目的无关。
#
# 需要演示站时手动 Run workflow 即可（前提：Settings → Pages 选 GitHub Actions
# 作为 Source，否则 `configure-pages` 会在部署阶段失败）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy read-only demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build read-only demo
        run: npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `build:demo` 输出到 dist-demo；`dist/` 是 WebUI/Tauri 构建，不参与 Pages。
          path: dist-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
